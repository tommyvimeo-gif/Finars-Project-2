<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fin Ars — arhitekturni biro</title>
<meta name="description" content="Fin Ars d.o.o. — center za arhitekturo, gradbeno projektiranje in celovite storitve. Zagorje ob Savi.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --color-bg: #0c0c0b;
  --color-fg: #f2efe8;
  --color-card: #141413;
  --color-muted: #9a968c;
  --color-line: rgb(242 239 232 / 0.1);
  --color-soft: #1c1c1a;
  --color-ink: #11110f;
  --color-stone: #cfc8ba;
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-sans: "Outfit", system-ui, sans-serif;
  --radius-card: 14px;
}

  button:not(:disabled),
  [role="button"]:not(:disabled) {
    cursor: pointer;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-fg);
    font-family: var(--font-sans);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }

  img {
    max-width: 100%;
    display: block;
  }

  a {
    color: inherit;
  }

.wrap {
  width: min(1120px, calc(100% - 2rem));
  margin-inline: auto;
}

.site-header {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 20;
  height: 64px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--color-line);
  background: rgb(12 12 11 / 0.82);
  backdrop-filter: blur(14px);
}

.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(1120px, calc(100% - 2rem));
  margin-inline: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}

.mark {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: var(--color-fg);
  color: var(--color-ink);
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.brand-name {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 500;
}

.desk-nav {
  display: flex;
  gap: 28px;
}

.desk-nav a {
  color: var(--color-muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 400;
}

.desk-nav a:hover {
  color: var(--color-fg);
}

.menu-btn {
  display: none;
  background: none;
  border: 0;
  color: var(--color-fg);
  width: 44px;
  height: 44px;
}

.mobile-nav {
  position: fixed;
  top: 64px;
  left: 0;
  right: 0;
  z-index: 19;
  background: var(--color-bg);
  border-bottom: 1px solid var(--color-line);
  padding: 8px 16px 16px;
}

.mobile-nav a {
  display: flex;
  min-height: 48px;
  align-items: center;
  color: var(--color-muted);
  text-decoration: none;
  font-size: 18px;
}

.bg-anim {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
  background: var(--color-bg);
}

.bg-slide {
  position: absolute;
  inset: -6%;
  width: 112%;
  height: 112%;
  object-fit: cover;
  opacity: 0;
  transform: scale(1.04);
  transition: opacity 1.6s ease;
  filter: saturate(0.72) contrast(1.05);
}

.bg-slide.is-on {
  opacity: 0.46;
  animation: ken 18s ease-in-out infinite alternate;
}

.bg-grid {
  position: absolute;
  inset: -50% 0 auto;
  height: 160%;
  background-image:
    linear-gradient(rgb(232 226 214 / 0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgb(232 226 214 / 0.07) 1px, transparent 1px);
  background-size: 84px 84px;
  transform: perspective(520px) rotateX(62deg);
  transform-origin: center top;
  animation: grid-drift 28s linear infinite;
  mask-image: linear-gradient(to bottom, transparent, #000 18%, #000 70%, transparent);
}

.bg-glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(72px);
  opacity: 0.5;
}

.bg-glow.a {
  width: 46vw;
  height: 46vw;
  left: -10%;
  top: 8%;
  background: radial-gradient(circle, rgb(207 200 186 / 0.38), transparent 68%);
  animation: glow-a 24s ease-in-out infinite alternate;
}

.bg-glow.b {
  width: 38vw;
  height: 38vw;
  right: -8%;
  top: 42%;
  background: radial-gradient(circle, rgb(92 88 80 / 0.5), transparent 70%);
  animation: glow-b 30s ease-in-out infinite alternate;
}

.bg-glow.c {
  width: 30vw;
  height: 30vw;
  left: 32%;
  bottom: -10%;
  background: radial-gradient(circle, rgb(232 226 214 / 0.18), transparent 70%);
  animation: glow-c 20s ease-in-out infinite alternate;
}

.bg-veil {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgb(12 12 11 / 0.28),
    rgb(12 12 11 / 0.55) 40%,
    rgb(12 12 11 / 0.82)
  );
}

main,
footer {
  position: relative;
  z-index: 1;
}

@keyframes grid-drift {
  from { background-position: 0 0; }
  to { background-position: 0 84px; }
}

@keyframes glow-a {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to { transform: translate3d(10%, 8%, 0) scale(1.18); }
}

@keyframes glow-b {
  from { transform: translate3d(0, 0, 0) scale(1.08); }
  to { transform: translate3d(-12%, -8%, 0) scale(0.88); }
}

@keyframes glow-c {
  from { transform: translate3d(0, 0, 0); }
  to { transform: translate3d(-8%, -12%, 0) scale(1.22); }
}

@keyframes ken {
  from { transform: scale(1.02) translate3d(0, 0, 0); }
  to { transform: scale(1.1) translate3d(-2%, -1.4%, 0); }
}

.hero {
  position: relative;
  min-height: 100dvh;
  display: flex;
  align-items: flex-end;
  padding: 96px 0 72px;
}

.kicker {
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-size: 12px;
  font-weight: 500;
  color: var(--color-fg);
  margin: 0 0 16px;
}

h1,
h2 {
  font-family: var(--font-display);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin: 0;
}

h1 {
  font-size: clamp(46px, 8vw, 78px);
  max-width: 14ch;
}

h1 em {
  font-style: italic;
}

.lede {
  max-width: 36rem;
  margin: 22px 0 0;
  color: var(--color-muted);
  font-size: 18px;
  line-height: 1.6;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 28px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 0 22px;
  border-radius: 10px;
  text-decoration: none;
  font-size: 15px;
  font-weight: 500;
  border: 1px solid transparent;
}

.btn-solid {
  background: var(--color-fg);
  color: var(--color-ink);
}

.btn-ghost {
  background: transparent;
  color: var(--color-fg);
  border-color: var(--color-line);
}

.slide-count {
  margin: 28px 0 0;
  color: var(--color-muted);
  letter-spacing: 0.18em;
  font-size: 12px;
  font-weight: 500;
}

.stats {
  border-block: 1px solid var(--color-line);
  background: rgb(12 12 11 / 0.55);
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  padding: 36px 0;
  text-align: center;
}

.stat b {
  display: block;
  font-family: var(--font-display);
  font-size: clamp(36px, 5vw, 52px);
  font-weight: 500;
}

.stat span {
  display: block;
  margin-top: 8px;
  color: var(--color-muted);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.block-section {
  padding: 88px 0;
  scroll-margin-top: 76px;
}

h2 {
  font-size: clamp(36px, 5vw, 52px);
  margin-top: 10px;
}

.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 28px;
  margin-top: 40px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 28px;
  margin-top: 28px;
}

.card {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  text-align: left;
}

.card-media {
  display: block;
  position: relative;
  overflow: hidden;
  border-radius: var(--radius-card);
  background: var(--color-card);
  aspect-ratio: 16 / 10;
}

.card-media img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1.1s ease, transform 0.6s ease;
}

.card-media img.is-on {
  opacity: 1;
}

.card:hover .card-media img.is-on {
  transform: scale(1.04);
}

.card-meta {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 12px;
  align-items: baseline;
}

.card-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 500;
  line-height: 1.2;
}

.card-year,
.card-sub {
  color: var(--color-muted);
  font-size: 14px;
}

.card-sub {
  display: block;
  margin-top: 4px;
}

.band {
  background: rgb(28 28 26 / 0.86);
}

.services {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 40px;
}

.service {
  border: 1px solid var(--color-line);
  background: var(--color-card);
  border-radius: var(--radius-card);
  padding: 24px;
}

.service:hover {
  border-color: rgb(207 200 186 / 0.4);
}

.service-n {
  font-family: var(--font-display);
  margin: 0;
  color: var(--color-fg);
}

.service h3 {
  margin: 12px 0 0;
  font-size: 18px;
  font-weight: 500;
}

.service p {
  margin: 8px 0 0;
  color: var(--color-muted);
  font-size: 14px;
  line-height: 1.6;
}

.about {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  gap: 48px;
  align-items: center;
}

.about p {
  color: var(--color-muted);
  line-height: 1.7;
}

.about strong {
  color: var(--color-fg);
  font-weight: 500;
}

.about img,
.news img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
  border-radius: var(--radius-card);
}

.news {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 36px;
  align-items: center;
  border-block: 1px solid var(--color-line);
  background: rgb(28 28 26 / 0.72);
  padding: 64px 0;
  scroll-margin-top: 76px;
}

.news .wrap {
  display: contents;
}

.news-copy,
.news-photo {
  width: min(1120px, calc(100% - 2rem));
}

.news-layout {
  width: min(1120px, calc(100% - 2rem));
  margin-inline: auto;
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 36px;
  align-items: center;
}

.news p {
  color: var(--color-muted);
  line-height: 1.7;
}

.news a {
  color: var(--color-fg);
}

.contact {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  margin-top: 40px;
}

.contact h3 {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--color-muted);
}

.contact p {
  margin: 8px 0 0;
  line-height: 1.6;
}

.block {
  margin-bottom: 28px;
}

label {
  display: block;
  font-size: 14px;
  margin-bottom: 8px;
  font-weight: 400;
}

input,
textarea {
  width: 100%;
  background: var(--color-soft);
  color: var(--color-fg);
  border: 1px solid var(--color-line);
  border-radius: 10px;
  padding: 14px;
  font: inherit;
  font-size: 15px;
}

textarea {
  min-height: 140px;
  resize: vertical;
}

input:focus,
textarea:focus {
  outline: 2px solid var(--color-stone);
  border-color: transparent;
}

.field {
  margin-bottom: 18px;
}

button.btn {
  width: 100%;
  border: 0;
  font: inherit;
  font-weight: 500;
}

.site-footer {
  border-top: 1px solid var(--color-line);
  background: rgb(12 12 11 / 0.72);
}

.foot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 28px 0;
  color: var(--color-muted);
  font-size: 14px;
}

.foot strong {
  color: var(--color-fg);
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 500;
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgb(0 0 0 / 0.72);
}

.dlg {
  width: min(920px, 100%);
  max-height: min(92dvh, 900px);
  overflow: auto;
  padding: 16px;
  border: 1px solid var(--color-line);
  border-radius: 16px;
  background: #121211;
}

.dlg-top {
  display: flex;
  justify-content: flex-end;
}

.close {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  border: 1px solid var(--color-line);
  background: transparent;
  color: var(--color-fg);
  font-size: 20px;
}

.hero-shot {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  border-radius: 12px;
  background: #000;
}

.thumbs {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-top: 8px;
}

.thumbs button {
  padding: 0;
  border: 0;
  background: none;
  border-radius: 8px;
  overflow: hidden;
  opacity: 0.7;
}

.thumbs button[aria-current="true"] {
  opacity: 1;
  outline: 2px solid var(--color-stone);
}

.thumbs img {
  width: 100%;
  aspect-ratio: 4 / 3;
  object-fit: cover;
}

.dlg h2 {
  font-size: clamp(32px, 4vw, 46px);
  margin-top: 8px;
}

.dlg .meta {
  color: var(--color-muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 12px;
  margin: 18px 0 0;
}

.dlg .authors,
.dlg .summary {
  color: var(--color-muted);
  line-height: 1.7;
}

.bar-end {
  display: flex;
  align-items: center;
  gap: 4px;
}

.langs {
  display: flex;
}

.langs button {
  min-width: 44px;
  min-height: 44px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--color-muted);
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.16em;
}

.langs button[aria-pressed="true"] {
  color: var(--color-fg);
}

@media (max-width: 860px) {
  .desk-nav {
    display: none;
  }

  .menu-btn {
    display: grid;
    place-items: center;
  }

  .stats-grid {
    grid-template-columns: 1fr 1fr;
  }

  .grid-2,
  .grid-3,
  .services,
  .about,
  .news-layout,
  .contact {
    grid-template-columns: 1fr;
  }

  .thumbs {
    grid-template-columns: repeat(4, 1fr);
  }

  .block-section {
    padding: 64px 0;
  }

  .foot {
    flex-direction: column;
    text-align: center;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  .bg-slide,
  .bg-grid,
  .bg-glow,
  .card-media img {
    animation: none;
    transition: none;
  }

  .bg-slide.is-on {
    transform: none;
  }
}

</style>
</head>
<body>
<div class="bg-anim" id="bg" aria-hidden="true">
  <div class="bg-glow a"></div>
  <div class="bg-glow b"></div>
  <div class="bg-glow c"></div>
  <div class="bg-grid"></div>
  <div class="bg-veil"></div>
</div>
<header class="site-header">
  <div class="bar">
    <a class="brand" href="#top"><span class="mark">FA</span><span class="brand-name">Fin Ars</span></a>
    <div class="bar-end">
      <nav class="desk-nav">
        <a href="#projekti" data-i18n="nav0">Projekti</a>
        <a href="#storitve" data-i18n="nav1">Storitve</a>
        <a href="#o-nas" data-i18n="nav2">O nas</a>
        <a href="#kontakt" data-i18n="nav3">Kontakt</a>
      </nav>
      <div class="langs" role="group" aria-label="Jezik">
        <button type="button" data-set-lang="sl" aria-pressed="true">SL</button>
        <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
      <button class="menu-btn" type="button" aria-expanded="false" aria-label="Odpri meni">☰</button>
    </div>
  </div>
</header>
<div class="mobile-nav" id="mobile-nav" hidden>
  <a href="#projekti" data-i18n="nav0">Projekti</a>
  <a href="#storitve" data-i18n="nav1">Storitve</a>
  <a href="#o-nas" data-i18n="nav2">O nas</a>
  <a href="#kontakt" data-i18n="nav3">Kontakt</a>
</div>
<main id="top">
  <section class="hero">
    <div class="wrap">
      <p class="kicker" data-i18n="heroKicker"></p>
      <h1 data-i18n-html="heroTitle"></h1>
      <p class="lede" data-i18n="lede"></p>
      <div class="actions">
        <a class="btn btn-solid" href="#projekti" data-i18n="viewProjects"></a>
        <a class="btn btn-ghost" href="#kontakt" data-i18n="getInTouch"></a>
      </div>
      <p class="slide-count" id="slide-count">01 / 07</p>
    </div>
  </section>
  <div class="stats">
    <div class="wrap stats-grid">
      <div class="stat"><b>20</b><span data-i18n="stat0"></span></div>
      <div class="stat"><b>150+</b><span data-i18n="stat1"></span></div>
      <div class="stat"><b>7</b><span data-i18n="stat2"></span></div>
      <div class="stat"><b>A+</b><span data-i18n="stat3"></span></div>
    </div>
  </div>
  <section class="block-section" id="projekti">
    <div class="wrap">
      <p class="kicker" data-i18n="projectsKicker"></p>
      <h2 data-i18n="projectsTitle"></h2>
      <div class="grid-2" id="grid-featured"></div>
      <div class="grid-3" id="grid-rest"></div>
    </div>
  </section>
  <section class="block-section band" id="storitve">
    <div class="wrap">
      <p class="kicker" data-i18n="servicesKicker"></p>
      <h2 data-i18n="servicesTitle"></h2>
      <div class="services" id="services"></div>
    </div>
  </section>
  <section class="block-section" id="o-nas">
    <div class="wrap about">
      <div>
        <p class="kicker" data-i18n="aboutKicker"></p>
        <h2 data-i18n="aboutTitle"></h2>
        <p data-i18n-html="aboutLead"></p>
        <p data-i18n="aboutTeam"></p>
      </div>
      <img src="https://cdn.jsdelivr.net/gh/tommyvimeo-gif/finars@main/public/brand/office.jpg" alt="Fin Ars">
    </div>
  </section>
  <section class="news" id="novice">
    <div class="news-layout">
      <div>
        <p class="kicker" data-i18n="newsKicker"></p>
        <h2 data-i18n="newsTitle"></h2>
        <p data-i18n="newsBody"></p>
        <p><a href="https://www.eu-skladi.si/" target="_blank" rel="noreferrer">eu-skladi.si →</a></p>
      </div>
      <img src="https://cdn.jsdelivr.net/gh/tommyvimeo-gif/finars@main/public/brand/news.jpg" alt="EU">
    </div>
  </section>
  <section class="block-section" id="kontakt">
    <div class="wrap">
      <p class="kicker" data-i18n="contactKicker"></p>
      <h2 data-i18n="contactTitle"></h2>
      <div class="contact">
        <div>
          <div class="block"><h3 data-i18n="addressLabel"></h3><p>Podvine 36<br>1410 Zagorje ob Savi</p></div>
          <div class="block"><h3 data-i18n="phoneLabel"></h3><p><a href="tel:+38641686959">+386 41 686 959</a><br><a href="tel:+38631370172">+386 31 370 172</a></p></div>
          <div class="block"><h3 data-i18n="emailLabel"></h3><p><a href="mailto:info@finars.si">info@finars.si</a><br><a href="mailto:kristijan.cuk@finars.si">kristijan.cuk@finars.si</a></p></div>
          <div class="block"><h3 data-i18n="companyLabel"></h3><p data-i18n-html="companyBody"></p></div>

const slides = projects.filter((p) => p.featured).map((p) => p.images[0]);
const bg = document.getElementById("bg");
slides.forEach((src, i) => {
  const img = document.createElement("img");
  img.src = src;
  img.alt = "";
  img.className = i === 0 ? "bg-slide is-on" : "bg-slide";
  const anchor = bg.querySelector(".bg-glow");
  bg.insertBefore(img, anchor);
});
let lang = "sl";
let slide = 0;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function pack() { return ui[lang]; }
function localize(p) {
  if (lang !== "en" || !enProjects[p.slug]) return p;
  return Object.assign({}, p, enProjects[p.slug]);
}
function card(p, cycle) {
  const btn = document.createElement("button");
  btn.className = "card";
  btn.type = "button";
  const frames = cycle ? p.images.slice(0, 4) : [p.images[0]];
  const media = document.createElement("span");
  media.className = "card-media";
  frames.forEach((src, i) => {
    const img = document.createElement("img");
    img.src = src;
    img.alt = i === 0 ? p.title : "";
    img.loading = "lazy";
    if (i === 0) img.className = "is-on";
    media.appendChild(img);
  });
  if (cycle && frames.length > 1 && !reduce) {
    let i = 0;
    setInterval(() => {
      i = (i + 1) % frames.length;
      [...media.children].forEach((el, n) => el.classList.toggle("is-on", n === i));
    }, 5200);
  }
  const meta = document.createElement("span");
  meta.className = "card-meta";
  meta.innerHTML = '<span class="card-title"></span><span class="card-year"></span>';
  const sub = document.createElement("span");
  sub.className = "card-sub";
  btn.append(media, meta, sub);
  btn.addEventListener("click", () => openProject(p));
  btn._fill = () => {
    const loc = localize(p);
    meta.querySelector(".card-title").textContent = loc.title;
    meta.querySelector(".card-year").textContent = String(loc.year);
    sub.textContent = loc.location + " · " + loc.category;
    media.querySelector("img").alt = loc.title;
  };
  btn._fill();
  return btn;
}
const featured = document.getElementById("grid-featured");
const rest = document.getElementById("grid-rest");
const cards = [];
projects.forEach((p) => {
  const node = card(p, Boolean(p.featured));
  (p.featured ? featured : rest).appendChild(node);
  cards.push(node);
});
const services = document.getElementById("services");
for (let n = 0; n < 6; n++) {
  const art = document.createElement("article");
  art.className = "service";
  art.innerHTML = '<p class="service-n">' + String(n + 1).padStart(2, "0") + '</p><h3 data-i18n="svcT' + n + '"></h3><p data-i18n="svcD' + n + '"></p>';
  services.appendChild(art);
}
function applyLang(next) {
  lang = next === "en" ? "en" : "sl";
  document.documentElement.lang = lang;
  const text = pack();
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = text[el.dataset.i18n] || ""; });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => { el.innerHTML = text[el.dataset.i18nHtml] || ""; });
  document.querySelectorAll("[data-i18n-attr]").forEach((el) => { el.placeholder = text[el.dataset.i18nAttr] || ""; });
  document.querySelectorAll("[data-set-lang]").forEach((btn) => {
    btn.setAttribute("aria-pressed", btn.dataset.setLang === lang ? "true" : "false");
  });
  document.querySelector(".langs").setAttribute("aria-label", text.langLabel);
  cards.forEach((node) => node._fill());
  try { localStorage.setItem("finars-lang", lang); } catch (e) {}
}
document.querySelectorAll("[data-set-lang]").forEach((btn) => {
  btn.addEventListener("click", () => applyLang(btn.dataset.setLang));
});
const menuBtn = document.querySelector(".menu-btn");
const mobile = document.getElementById("mobile-nav");
menuBtn.addEventListener("click", () => {
  const open = !mobile.hidden;
  mobile.hidden = open;
  menuBtn.setAttribute("aria-expanded", String(!open));
  menuBtn.setAttribute("aria-label", open ? pack().menuOpen : pack().menuClose);
  menuBtn.textContent = open ? "☰" : "×";
});
mobile.querySelectorAll("a").forEach((a) => a.addEventListener("click", () => {
  mobile.hidden = true;
  menuBtn.setAttribute("aria-expanded", "false");
  menuBtn.textContent = "☰";
}));
const modal = document.getElementById("modal");
const shot = document.getElementById("shot");
const thumbs = document.getElementById("thumbs");
function openProject(raw) {
  const p = localize(raw);
  document.getElementById("ptitle").textContent = p.title;
  document.getElementById("meta").textContent = p.year + " · " + p.location + " · " + p.category;
  document.getElementById("authors").textContent = pack().authors + ": " + raw.authors;
  document.getElementById("summary").textContent = p.summary;
  thumbs.innerHTML = "";
  p.images.forEach((src, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<img alt="" src="' + src + '">';
    b.addEventListener("click", () => show(src, p.title, b));
    thumbs.appendChild(b);
    if (i === 0) show(src, p.title, b);
  });
  modal.hidden = false;
}
function show(src, title, button) {
  shot.src = src;
  shot.alt = title;
  [...thumbs.children].forEach((b) => b.setAttribute("aria-current", b === button ? "true" : "false"));
}
document.getElementById("close").addEventListener("click", () => { modal.hidden = true; });
modal.addEventListener("click", (e) => { if (e.target === modal) modal.hidden = true; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") modal.hidden = true; });
document.getElementById("contact-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const data = new FormData(e.currentTarget);
  const body = pack().mailName + ": " + data.get("name") + "\n" + pack().mailEmail + ": " + data.get("email") + "\n\n" + data.get("message");
  location.href = "mailto:info@finars.si?subject=" + encodeURIComponent(pack().mailSubject) + "&body=" + encodeURIComponent(body);
});
const slideImgs = [...bg.querySelectorAll(".bg-slide")];
const counter = document.getElementById("slide-count");
function paintSlide() {
  slideImgs.forEach((img, i) => img.classList.toggle("is-on", i === slide));
  counter.textContent = String(slide + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
}
if (!reduce) {
  setInterval(() => {
    slide = (slide + 1) % slides.length;
    paintSlide();
  }, 7000);
}
paintSlide();
try {
  if (localStorage.getItem("finars-lang") === "en") applyLang("en");
  else applyLang("sl");
} catch (e) { applyLang("sl"); }
</script>
